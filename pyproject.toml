[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specpilot"
version = "0.1.0"
description = "Safety-first specification intelligence foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "defusedxml>=0.7",
    "fastapi>=0.115",
    # The only client that reaches a provider. Core rather than optional: a
    # route the default install cannot make is a route nobody notices is broken
    # until the week it is needed.
    "httpx>=0.27",
    "mcp>=1.26,<2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    # Held to the same minor as the server image compose.yaml pins. The client
    # warns beyond one minor apart, and a skewed pair can serialize a request
    # the server mishandles; moving one without the other is a corpus decision,
    # not a dependency bump.
    "qdrant-client>=1.12,<1.13",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "hypothesis>=6.0",
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]
# Only `specpilot embedding measure` needs these, and it imports them lazily.
# The default install stays free of a tensor runtime, and the unit suite runs
# without one.
embedding = [
    "torch>=2.4",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specpilot.egress.policies" = ["*.json"]
"specpilot.api.static" = ["trace/*.html", "trace/assets/*.js", "trace/assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:^Field 'lifespan' has an incomplete definition.*:pydantic_settings.sources.utils.IncompleteFieldDefinitionWarning:pydantic_settings\\.sources\\.utils$",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "integration: tests requiring integration dependencies",
    "fixture_smoke: deterministic synthetic-fixture smoke tests",
    "anyio: async tests driven by the anyio pytest plugin",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unused_configs = true

# The embedding runtime is an optional extra, so typechecking has to pass
# whether or not it is installed.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true
