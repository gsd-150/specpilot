[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specpilot"
version = "0.1.0"
description = "Safety-first specification intelligence foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specpilot.egress.policies" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "integration: tests requiring integration dependencies",
    "fixture_smoke: deterministic synthetic-fixture smoke tests",
    "anyio: async tests driven by the anyio pytest plugin",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unused_configs = true
