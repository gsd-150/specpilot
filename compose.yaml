# SpecPilot W0 service skeleton.
#
# Port policy: this file publishes nothing. Not one service, not one port.
# Publishing lives only in compose.demo.yaml, which has to be passed explicitly:
#
#   docker compose -f compose.yaml -f compose.demo.yaml --profile demo up --wait
#
# An earlier version used a second service with `extends` to hold the demo port.
# That silently published it in the real profile too, because `extends` inherits
# the base service's `profiles` list. The invariant is now textual and easy to
# check: no `ports:` key appears anywhere below.
#
# W3 status: MCP and API load only explicit deployment bindings. Missing or
# invalid inputs leave a sanitized unavailable health surface.

name: specpilot

networks:
  internal:
    internal: true
  egress:
    # Only services that legitimately talk outward join this. In W0 nothing
    # does: the fixture route never leaves the machine.
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["demo", "real"]
    environment:
      POSTGRES_USER: specpilot
      POSTGRES_PASSWORD: specpilot-local-only
      POSTGRES_DB: specpilot
    networks: [internal]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specpilot -d specpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["demo", "real"]
    networks: [internal]
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # bash, not CMD-SHELL: /bin/sh is dash here and has no /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 20

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    profiles: ["demo", "real"]
    networks: [internal]
    volumes:
      - ${SPECPILOT_MCP_CORPUS_MANIFEST_DIR_HOST}:/run/specpilot/corpus:ro
      - ${SPECPILOT_MCP_SOURCE_MANIFEST_DIR_HOST}:/run/specpilot/manifests:ro
      - ${SPECPILOT_MCP_SOURCE_DATA_DIR_HOST}:/run/specpilot/sources:ro
      - ${SPECPILOT_READY_DIR_HOST}:/run/specpilot/ready:ro
    environment:
      SPECPILOT_MCP_CORPUS_MANIFEST_DIR: /run/specpilot/corpus
      SPECPILOT_MCP_CORPUS_MANIFEST_ID: ${SPECPILOT_MCP_CORPUS_MANIFEST_ID:-}
      SPECPILOT_MCP_SOURCE_MANIFEST_DIR: /run/specpilot/manifests
      SPECPILOT_MCP_SOURCES_JSON: ${SPECPILOT_MCP_SOURCES_JSON:-[]}
      SPECPILOT_MCP_READY_DIR: /run/specpilot/ready
      SPECPILOT_MCP_READY_ID: ${SPECPILOT_MCP_READY_ID}
      SPECPILOT_MCP_MODE: ${SPECPILOT_API_PROFILE}
      SPECPILOT_MCP_ALLOWED_HOSTS_JSON: '["127.0.0.1:8080","mcp:8080"]'
      SPECPILOT_MCP_ALLOWED_ORIGINS_JSON: '["http://127.0.0.1:8080","http://mcp:8080"]'
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      fixture-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      # Hits /health rather than probing the port, so a process that is
      # listening but not serving is reported unhealthy.
      test: ["CMD", "python", "-c",
              "import urllib.request as r; r.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    profiles: ["demo", "real"]
    networks: [internal, egress]
    volumes:
      - ${SPECPILOT_MCP_CORPUS_MANIFEST_DIR_HOST}:/run/specpilot/corpus:ro
      - ${SPECPILOT_MCP_SOURCE_MANIFEST_DIR_HOST}:/run/specpilot/manifests:ro
      - ${SPECPILOT_MCP_SOURCE_DATA_DIR_HOST}:/run/specpilot/sources:ro
      - ${SPECPILOT_READY_DIR_HOST}:/run/specpilot/ready:ro
    environment:
      SPECPILOT_API_PROFILE: ${SPECPILOT_API_PROFILE}
      SPECPILOT_API_DSN: ${SPECPILOT_API_DSN}
      SPECPILOT_API_MCP_URL: ${SPECPILOT_API_MCP_URL}
      SPECPILOT_API_SESSION_SECRET: ${SPECPILOT_API_SESSION_SECRET}
      SPECPILOT_API_SESSION_AUDIENCE: ${SPECPILOT_API_SESSION_AUDIENCE}
      SPECPILOT_API_BIND_HOST: ${SPECPILOT_API_BIND_HOST}
      SPECPILOT_API_CONFIGURATION_HASH: ${SPECPILOT_API_CONFIGURATION_HASH}
      SPECPILOT_API_PROMPT_ID: ${SPECPILOT_API_PROMPT_ID}
      SPECPILOT_API_PROMPT_HASH: ${SPECPILOT_API_PROMPT_HASH}
      SPECPILOT_API_COMPLIANCE_PROMPT_HASH: ${SPECPILOT_API_COMPLIANCE_PROMPT_HASH}
      SPECPILOT_API_VERIFIER_PROMPT_HASH: ${SPECPILOT_API_VERIFIER_PROMPT_HASH}
      SPECPILOT_MCP_CORPUS_MANIFEST_DIR: /run/specpilot/corpus
      SPECPILOT_MCP_CORPUS_MANIFEST_ID: ${SPECPILOT_MCP_CORPUS_MANIFEST_ID}
      SPECPILOT_MCP_SOURCE_MANIFEST_DIR: /run/specpilot/manifests
      SPECPILOT_MCP_SOURCES_JSON: ${SPECPILOT_MCP_SOURCES_JSON}
      SPECPILOT_MCP_READY_DIR: /run/specpilot/ready
      SPECPILOT_MCP_READY_ID: ${SPECPILOT_MCP_READY_ID}
      SPECPILOT_MCP_MODE: ${SPECPILOT_API_PROFILE}
      SPECPILOT_MAIN_API_KEY: ${SPECPILOT_MAIN_API_KEY}
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      # Hits /health rather than probing the port, so a process that is
      # listening but not serving is reported unhealthy.
      test: ["CMD", "python", "-c",
              "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 3s
      timeout: 3s
      retries: 20

  fixture-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: fixture
    profiles: ["demo"]
    networks: [internal]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./fixtures/demo:/run/specpilot/fixture:ro
      - ${SPECPILOT_MCP_CORPUS_MANIFEST_DIR_HOST}:/run/specpilot/corpus
      - ${SPECPILOT_MCP_SOURCE_MANIFEST_DIR_HOST}:/run/specpilot/manifests
      - ${SPECPILOT_READY_DIR_HOST}:/run/specpilot/ready
    entrypoint: ["python", "-m", "specpilot.cli"]
    command:
      - "corpus"
      - "init-fixture"
      - "--fixture-dir"
      - "/run/specpilot/fixture"
      - "--source-manifest-dir"
      - "/run/specpilot/manifests"
      - "--corpus-manifest-dir"
      - "/run/specpilot/corpus"
      - "--ready-dir"
      - "/run/specpilot/ready"
      - "--qdrant-url"
      - "http://qdrant:6333"

  # The only container that handles untrusted documents. Everything here is a
  # deliberate restriction, not boilerplate.
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    profiles: ["ingestion"]
    network_mode: none
    read_only: true
    user: "10002:10002"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 64
    restart: "no"
    volumes:
      - ./data/inbox:/input:ro
      - ./data/inspections:/output
    tmpfs:
      - /tmp:size=64m,mode=1777
