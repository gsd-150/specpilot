# Real initialization override. It publishes no host ports and never mounts or
# invokes the synthetic fixture. Private source/vector input stays read-only;
# only the dedicated corpus-manifest and ready stores are writable.

services:
  mcp:
    depends_on:
      real-init:
        condition: service_completed_successfully

  real-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: initializer-runtime
    profiles: ["real"]
    networks: [internal]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"
    volumes:
      - ${CORPUS_DIR}:/run/specpilot/real-input:ro
      - ${SPECPILOT_MCP_CORPUS_MANIFEST_DIR_HOST}:/run/specpilot/corpus-manifests
      - ${SPECPILOT_READY_DIR_HOST}:/run/specpilot/ready
    entrypoint: ["python", "-m", "specpilot.cli"]
    command:
      - "corpus"
      - "init-real"
      - "--corpus-dir"
      - "/run/specpilot/real-input"
      - "--corpus-manifest-dir"
      - "/run/specpilot/corpus-manifests"
      - "--ready-dir"
      - "/run/specpilot/ready"
      - "--qdrant-url"
      - "http://qdrant:6333"
